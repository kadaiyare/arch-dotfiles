# ~/.config/foot/foot.ini

# [main] セクション（またはセクション指定なしの冒頭）に基本設定を記述します
[main]
font=UDEV Gothic 35DZNFLG:size=20
pad=10x10

initial-color-theme=light

[scrollback]
# Three times the default mouse scroll speed (3.0).
multiplier=9.0

[cursor]
blink=no

# Official Catppuccin Latte text palette, matching Starship; keep the existing white glass in both modes.
[colors-dark]
# Frosted glass: 32% white background; Hyprland keeps text fully opaque.
alpha=0.32
alpha-mode=matching
blur=yes
foreground=4c4f69
background=ffffff
regular0=5c5f77
regular1=d20f39
regular2=40a02b
regular3=df8e1d
regular4=1e66f5
regular5=ea76cb
regular6=179299
regular7=acb0be
bright0=6c6f85
bright1=d20f39
bright2=40a02b
bright3=df8e1d
bright4=1e66f5
bright5=ea76cb
bright6=179299
bright7=bcc0cc
cursor=ffffff 4c4f69
16=fe640b
17=dc8a78
selection-foreground=4c4f69
selection-background=c7d0e2
search-box-no-match=ffffff b21832
search-box-match=4c4f69 e0e7f2
jump-labels=4c4f69 d9bd85
urls=1e66f5

[colors-light]
# Use the same Catppuccin Latte palette for the white glass in both modes.
alpha=0.32
alpha-mode=matching
blur=yes
foreground=4c4f69
background=ffffff
regular0=5c5f77
regular1=d20f39
regular2=40a02b
regular3=df8e1d
regular4=1e66f5
regular5=ea76cb
regular6=179299
regular7=acb0be
bright0=6c6f85
bright1=d20f39
