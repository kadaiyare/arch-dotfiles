# ~/.config/hypr/hyprlock.conf

# --- 一般設定 ---
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# --- 背景画像 ---
background {
    monitor =
    # ★ここに壁紙のパスを指定してください
    path = $HOME/Pictures/wp11912480.png
    
    # ブラー（ぼかし）設定
    blur_passes = 2 # 0にするとぼかし無効
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- 入力フィールド ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    
    # Catppuccin Mocha Colors
    outer_color = rgb(137, 180, 250) # Blue
    inner_color = rgb(30, 30, 46)    # Base
    font_color = rgb(205, 214, 244)  # Text
    fail_color = rgb(243, 139, 168)  # Red
    check_color = rgb(166, 227, 161) # Green

    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Password...</i> # Text rendered in the input box
    hide_input = false
    rounding = -1 # -1 means complete circle (pill shape)

    position = 0, -50
    halign = center
    valign = center
}

# --- 時計 (時間) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgb(205, 214, 244) # Text
    font_size = 64
    font_family = UDEV Gothic 35NF Bold
    shadow_passes = 3
    shadow_size = 4

    position = 0, 100
    halign = center
    valign = center
}

# --- 日付 ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%A, %B %d")</b>"
    color = rgb(186, 194, 222) # Subtext1
    font_size = 18
    font_family = UDEV Gothic 35NF
    
    position = 0, 50
    halign = center
    valign = center
}
# --- ユーザーアイコン/挨拶 ---
label {
    monitor =
    text = Hi, $USER
    color = rgb(137, 180, 250) # Blue
    font_size = 16
    font_family = UDEV Gothic 35NF Bold

    position = 0, -10
    halign = center
    valign = center
}