# font_family UDEV Gothic 35DZNFLG
# bold_font auto
# italic_font auto
# bold_italic_font auto
font_size 20.0


# BEGIN_KITTY_FONTS
font_family      family="UDEV Gothic 35DZNFLG"
# 他のフォントへのフォールバック（自動代替）を極力抑え込む
narrow_symbols   U+E000-U+E00A,U+F000-U+F2E0 1
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
cursor_blink_interval 0
# BEGIN_KITTY_THEME
Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
window_padding_width 10
